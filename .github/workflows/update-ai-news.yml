name: Update AI News

on:
  schedule:
    - cron: '0 */6 * * *'   # هر ۶ ساعت یک‌بار
  workflow_dispatch: {}       # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest AI news
        run: node fetch-ai-news.js

      - name: Commit updated ai-news.json if changed
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- ai-news.json; then
            git add ai-news.json
            git commit -m "chore: update AI news [automated]"
            git push
          else
            echo "No changes in news."
          fi
